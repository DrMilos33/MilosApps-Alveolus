<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ALVEOLUS Browser-Soak</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { min-width: 1280px; min-height: 100%; }
    body { margin: 0; background: #102f36; color: #f7f1e7; overflow: auto; }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 12px;
      align-items: center;
      min-height: 50px;
      padding: 6px 16px;
      background: rgb(9 38 45 / 94%);
      border-bottom: 1px solid rgb(247 241 231 / 18%);
      backdrop-filter: blur(6px);
    }
    button { min-height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: #159b99; color: white; font-weight: 700; }
    button:disabled { opacity: .55; }
    #status { flex: 1; min-width: 0; }
    #surface {
      position: relative;
      width: 1280px;
      height: 720px;
      margin: 0 auto;
      background: #000;
      box-shadow: 0 8px 28px rgb(0 0 0 / 32%);
    }
    iframe {
      display: block;
      width: 1280px;
      height: 720px;
      border: 0;
      background: #000;
    }
    pre {
      width: 1248px;
      max-height: 160px;
      margin: 8px auto 16px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <button id="start" disabled>60-Sekunden-Messung starten</button>
    <span id="status">Webbuild wird geladen …</span>
  </header>
  <main id="surface" aria-label="Feste 1280 × 720 Testfläche">
    <iframe id="game" title="ALVEOLUS Webbuild" width="1280" height="720" allow="autoplay; gamepad"></iframe>
  </main>
  <pre id="result">Noch keine Messung.</pre>
  <script>
    "use strict";

    const EXPECTED_SURFACE = Object.freeze({ width: 1280, height: 720 });
    const EXPECTED_ENTITIES = Object.freeze({ enemies: 600, pickups: 360, projectiles: 464, feedback: 80 });
    const EXPECTED_RENDER = Object.freeze({
      crowd_enemy_visuals: 600,
      crowd_pickup_visuals: 360,
      crowd_visuals: 960,
      projectile_visuals: 464,
      feedback_visuals: 80,
    });
    const params = new URLSearchParams(location.search);

    function boundedSeconds(name, fallback, minimum, maximum) {
      const raw = params.get(name);
      const parsed = raw == null || raw === "" ? fallback : Number(raw);
      return Number.isFinite(parsed) ? Math.min(maximum, Math.max(minimum, parsed)) : fallback;
    }

    const durationSeconds = boundedSeconds("duration", 60, 5, 1800);
    const warmupSeconds = boundedSeconds("warmup", 5, 0, 120);
    const durationMs = durationSeconds * 1000;
    const warmupMs = warmupSeconds * 1000;
    const rawGameUrl = params.get("game") || "../build/web/index.html";
    const baseGameUrl = new URL(rawGameUrl, location.href);
    const iframe = document.querySelector("#game");
    const startButton = document.querySelector("#start");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const diagnostics = [];
    let activeRun = null;
    let measurementRunning = false;
    let runSequence = 0;

    startButton.textContent = `${Math.round(durationSeconds)}-Sekunden-Messung starten`;
    window.__ALVEOLUS_SOAK__ = { done: false, report: null };

    function createDeferred() {
      let resolve;
      const promise = new Promise(innerResolve => { resolve = innerResolve; });
      return { promise, resolve };
    }

    function errorDetails(reason) {
      if (reason == null) return { message: "unknown_error", stack: null };
      try {
        return {
          message: String(reason.message || reason),
          stack: reason.stack ? String(reason.stack) : null,
        };
      } catch (_error) {
        return { message: "unreadable_error", stack: null };
      }
    }

    function recordDiagnostic(level, source, details = {}, run = activeRun) {
      diagnostics.push({
        timestamp_utc: new Date().toISOString(),
        performance_ms: performance.now(),
        run_id: run?.id ?? null,
        phase: run?.stage ?? "harness_startup",
        level,
        source,
        message: String(details.message || source),
        url: details.url ? String(details.url) : null,
        line: Number.isFinite(details.line) ? details.line : null,
        column: Number.isFinite(details.column) ? details.column : null,
        stack: details.stack ? String(details.stack) : null,
      });
    }

    window.addEventListener("error", event => {
      const details = errorDetails(event.error || event.message);
      recordDiagnostic("error", "parent.error", {
        ...details,
        url: event.filename,
        line: event.lineno,
        column: event.colno,
      });
    });
    window.addEventListener("unhandledrejection", event => {
      recordDiagnostic("error", "parent.unhandledrejection", errorDetails(event.reason));
    });
    window.addEventListener("securitypolicyviolation", event => {
      recordDiagnostic("error", "parent.securitypolicyviolation", {
        message: event.violatedDirective,
        url: event.blockedURI,
        line: event.lineNumber,
        column: event.columnNumber,
      });
    });

    function recordVisibility(run, reason) {
      if (!run) return;
      const entry = {
        elapsed_ms: performance.now() - run.createdAt,
        reason,
        visibility_state: document.visibilityState,
        hidden: document.hidden,
        parent_has_focus: document.hasFocus(),
        iframe_has_focus: document.activeElement === iframe,
      };
      run.visibilityTimeline.push(entry);
      if (entry.hidden) {
        run.hiddenSeen = true;
        if (run.kind === "measurement" && run.cancelActiveRaf) run.cancelActiveRaf("document_hidden");
      }
    }

    document.addEventListener("visibilitychange", () => recordVisibility(activeRun, "visibilitychange"));
    window.addEventListener("focus", () => recordVisibility(activeRun, "parent_focus"));
    window.addEventListener("blur", () => recordVisibility(activeRun, "parent_blur"));

    function attachIframeDiagnostics(run, trigger) {
      if (!run || run !== activeRun) return false;
      try {
        const frameWindow = iframe.contentWindow;
        const frameDocument = frameWindow.document;
        if (run.hookedDocument === frameDocument) return true;
        run.hookedDocument = frameDocument;
        frameWindow.addEventListener("error", event => {
          const details = errorDetails(event.error || event.message);
          recordDiagnostic("error", "iframe.error", {
            ...details,
            url: event.filename || frameWindow.location.href,
            line: event.lineno,
            column: event.colno,
          }, run);
        });
        frameWindow.addEventListener("unhandledrejection", event => {
          recordDiagnostic("error", "iframe.unhandledrejection", errorDetails(event.reason), run);
        });
        frameWindow.addEventListener("focus", () => recordVisibility(run, "iframe_focus"));
        frameWindow.addEventListener("blur", () => recordVisibility(run, "iframe_blur"));
        run.iframeErrorHookAttached = true;
        recordDiagnostic("info", "iframe.error_hook_attached", { message: trigger }, run);
        return true;
      } catch (error) {
        run.iframeErrorHookFailure = errorDetails(error);
        return false;
      }
    }

    function configuredGameUrl(runId) {
      const url = new URL(baseGameUrl.href);
      if (params.get("game_stress") !== "0") {
        url.searchParams.set("stress", "1");
        url.searchParams.set("auto_start", "1");
        url.searchParams.set("stress_warmup", String(warmupSeconds));
        url.searchParams.set("stress_duration", String(durationSeconds));
      }
      url.searchParams.set("alveolus_soak_run_id", runId);
      return url;
    }

    function frameDocumentRunId() {
      try {
        return new URL(iframe.contentWindow.location.href).searchParams.get("alveolus_soak_run_id");
      } catch (_error) {
        return null;
      }
    }

    function beginNavigation(kind) {
      const id = `${Date.now().toString(36)}-${(++runSequence).toString(36)}`;
      const ready = createDeferred();
      const telemetry = createDeferred();
      const run = {
        id,
        kind,
        stage: "navigation",
        createdAt: performance.now(),
        url: configuredGameUrl(id),
        errorStartIndex: diagnostics.length,
        visibilityTimeline: [],
        hiddenSeen: document.hidden,
        iframeErrorHookAttached: false,
        iframeErrorHookFailure: null,
        hookedDocument: null,
        loadSeen: false,
        readySeen: false,
        resultSeen: false,
        correlationMode: "same_origin_query",
        gameTelemetry: null,
        ready,
        telemetry,
        cancelActiveRaf: null,
      };
      activeRun = run;
      recordVisibility(run, "navigation_requested");
      iframe.src = run.url.href;

      // Polling catches the new same-origin Document before its load event, so
      // startup failures from the asynchronously initialized Godot runtime are
      // captured as early as the browser allows without changing the build.
      run.hookPoll = setInterval(() => {
        if (run !== activeRun) {
          clearInterval(run.hookPoll);
          return;
        }
        if (frameDocumentRunId() === run.id && attachIframeDiagnostics(run, "document_poll")) {
          clearInterval(run.hookPoll);
        }
      }, 10);
      setTimeout(() => clearInterval(run.hookPoll), 30000);
      run.buildInfoPromise = inspectBuild(run.url);
      return run;
    }

    iframe.addEventListener("load", () => {
      const run = activeRun;
      if (!run) return;
      const documentRunId = frameDocumentRunId();
      if (documentRunId != null && documentRunId !== run.id) return;
      run.loadSeen = true;
      attachIframeDiagnostics(run, "iframe_load");
      recordVisibility(run, "iframe_load");
      if (run.kind === "preview") status.textContent = "Webbuild geladen · warte auf die Stresslast …";
    });
    iframe.addEventListener("error", () => {
      recordDiagnostic("error", "iframe.element_error", { message: "iframe_navigation_failed", url: activeRun?.url?.href });
    });

    function messageBelongsToRun(run, event) {
      if (!run || event.source !== iframe.contentWindow) return false;
      const documentRunId = frameDocumentRunId();
      if (documentRunId != null) {
        run.correlationMode = "same_origin_query";
        return documentRunId === run.id;
      }
      run.correlationMode = "source_plus_single_result";
      return run.loadSeen;
    }

    window.addEventListener("message", event => {
      const run = activeRun;
      if (!messageBelongsToRun(run, event) || !event.data || typeof event.data !== "object") return;
      if (event.data.type === "alveolus.render_stress.ready") {
        if (run.readySeen) {
          recordDiagnostic("error", "protocol.duplicate_ready", { message: "Only one ready message is allowed." }, run);
          return;
        }
        run.readySeen = true;
        run.readyPayload = event.data.payload ?? null;
        run.ready.resolve(true);
        if (run.kind === "preview") {
          startButton.disabled = false;
          status.textContent = "Webbuild und Stresslast bereit.";
        }
      } else if (event.data.type === "alveolus.render_stress.result") {
        if (!run.readySeen) {
          recordDiagnostic("error", "protocol.result_before_ready", { message: "A result without a matching ready message is rejected." }, run);
          return;
        }
        if (run.resultSeen) {
          recordDiagnostic("error", "protocol.duplicate_result", { message: "Only one result message is allowed." }, run);
          return;
        }
        run.resultSeen = true;
        run.gameTelemetry = event.data.payload ?? null;
        run.telemetry.resolve(run.gameTelemetry);
      }
    });

    function waitForSignal(deferred, timeoutMs) {
      return Promise.race([
        deferred.promise,
        new Promise(resolve => setTimeout(() => resolve(false), timeoutMs)),
      ]);
    }

    function runAnimationFramePhase(run, requestedMs, collectSamples) {
      const capacity = collectSamples ? Math.max(8, Math.ceil(requestedMs) + 64) : 0;
      const samples = collectSamples ? new Float64Array(capacity) : new Float64Array(0);
      if (requestedMs <= 0) return Promise.resolve({ completed: true, reason: null, elapsedMs: 0, samples, count: 0 });
      return new Promise(resolve => {
        let finished = false;
        let animationFrameId = 0;
        let firstTimestamp = null;
        let previousTimestamp = null;
        let count = 0;
        const wallStarted = performance.now();
        const safetyMs = requestedMs + Math.max(10000, requestedMs * 0.10);

        function finish(reason, timestamp = performance.now()) {
          if (finished) return;
          finished = true;
          cancelAnimationFrame(animationFrameId);
          clearTimeout(safetyTimer);
          run.cancelActiveRaf = null;
          resolve({
            completed: reason == null,
            reason,
            elapsedMs: firstTimestamp == null ? timestamp - wallStarted : timestamp - firstTimestamp,
            samples,
            count,
          });
        }

        function onAnimationFrame(timestamp) {
          if (finished) return;
          if (run !== activeRun) {
            finish("run_replaced", timestamp);
            return;
          }
          if (document.hidden) {
            run.hiddenSeen = true;
            finish("document_hidden", timestamp);
            return;
          }
          if (firstTimestamp == null) {
            firstTimestamp = timestamp;
            previousTimestamp = timestamp;
          } else if (collectSamples) {
            if (count >= samples.length) {
              finish("sample_capacity_exceeded", timestamp);
              return;
            }
            samples[count++] = timestamp - previousTimestamp;
            previousTimestamp = timestamp;
          }
          if (timestamp - firstTimestamp >= requestedMs) finish(null, timestamp);
          else animationFrameId = requestAnimationFrame(onAnimationFrame);
        }

        const safetyTimer = setTimeout(() => finish("raf_timeout"), safetyMs);
        run.cancelActiveRaf = reason => finish(reason);
        if (document.hidden) run.cancelActiveRaf("document_hidden");
        else animationFrameId = requestAnimationFrame(onAnimationFrame);
      });
    }

    function percentile(sorted, fraction) {
      if (!sorted.length) return 0;
      return sorted[Math.max(0, Math.min(sorted.length - 1, Math.ceil(sorted.length * fraction) - 1))];
    }

    function summarizeSamples(phase) {
      const sorted = phase.samples.slice(0, phase.count);
      sorted.sort();
      let total = 0;
      let longFrames = 0;
      let stalls = 0;
      for (let index = 0; index < phase.count; index += 1) {
        const value = phase.samples[index];
        total += value;
        if (value > 50) longFrames += 1;
        if (value > 100) stalls += 1;
      }
      const p99 = percentile(sorted, .99);
      return {
        timing: {
          avg: phase.count ? total / phase.count : 0,
          p50: percentile(sorted, .50),
          p95: percentile(sorted, .95),
          p99,
          max: phase.count ? sorted[phase.count - 1] : 0,
        },
        fps: {
          effective: phase.count * 1000 / Math.max(phase.elapsedMs, .001),
          one_percent_low: 1000 / Math.max(p99, .001),
        },
        longFrames,
        stalls,
      };
    }

    function finiteNumber(value) {
      return typeof value === "number" && Number.isFinite(value);
    }

    function roundedRect(rect) {
      return { x: rect.x, y: rect.y, width: rect.width, height: rect.height };
    }

    function captureSurface() {
      const iframeRect = iframe.getBoundingClientRect();
      const frame = {
        attribute: { width: Number(iframe.getAttribute("width")), height: Number(iframe.getAttribute("height")) },
        css_rect: roundedRect(iframeRect),
        computed_css: { width: getComputedStyle(iframe).width, height: getComputedStyle(iframe).height },
        client: { width: iframe.clientWidth, height: iframe.clientHeight },
      };
      try {
        const frameWindow = iframe.contentWindow;
        const frameDocument = frameWindow.document;
        const canvas = frameDocument.querySelector("canvas");
        frame.viewport = { width: frameWindow.innerWidth, height: frameWindow.innerHeight, device_pixel_ratio: frameWindow.devicePixelRatio };
        if (!canvas) return { accessible: true, frame, canvas: null, error: "canvas_missing" };
        const canvasRect = canvas.getBoundingClientRect();
        const canvasStyle = frameWindow.getComputedStyle(canvas);
        const cssWidth = canvasRect.width;
        const cssHeight = canvasRect.height;
        return {
          accessible: true,
          frame,
          canvas: {
            css_rect: roundedRect(canvasRect),
            computed_css: { width: canvasStyle.width, height: canvasStyle.height },
            client: { width: canvas.clientWidth, height: canvas.clientHeight },
            backing_store: { width: canvas.width, height: canvas.height },
            backing_scale: {
              x: cssWidth > 0 ? canvas.width / cssWidth : null,
              y: cssHeight > 0 ? canvas.height / cssHeight : null,
            },
          },
          error: null,
        };
      } catch (error) {
        return { accessible: false, frame, canvas: null, error: errorDetails(error) };
      }
    }

    function validateSurface(surface, label) {
      const failures = [];
      const nearly = (actual, expected) => finiteNumber(actual) && Math.abs(actual - expected) <= .5;
      if (!surface?.accessible) failures.push(`${label}.inaccessible`);
      if (!nearly(surface?.frame?.css_rect?.width, EXPECTED_SURFACE.width)) failures.push(`${label}.iframe_css_width`);
      if (!nearly(surface?.frame?.css_rect?.height, EXPECTED_SURFACE.height)) failures.push(`${label}.iframe_css_height`);
      if (surface?.frame?.attribute?.width !== EXPECTED_SURFACE.width) failures.push(`${label}.iframe_attribute_width`);
      if (surface?.frame?.attribute?.height !== EXPECTED_SURFACE.height) failures.push(`${label}.iframe_attribute_height`);
      if (surface?.frame?.viewport?.width !== EXPECTED_SURFACE.width) failures.push(`${label}.iframe_viewport_width`);
      if (surface?.frame?.viewport?.height !== EXPECTED_SURFACE.height) failures.push(`${label}.iframe_viewport_height`);
      if (!surface?.canvas) failures.push(`${label}.canvas_missing`);
      if (!nearly(surface?.canvas?.css_rect?.width, EXPECTED_SURFACE.width)) failures.push(`${label}.canvas_css_width`);
      if (!nearly(surface?.canvas?.css_rect?.height, EXPECTED_SURFACE.height)) failures.push(`${label}.canvas_css_height`);
      const backingWidth = surface?.canvas?.backing_store?.width;
      const backingHeight = surface?.canvas?.backing_store?.height;
      if (!finiteNumber(backingWidth) || backingWidth <= 0) failures.push(`${label}.canvas_backing_width`);
      if (!finiteNumber(backingHeight) || backingHeight <= 0) failures.push(`${label}.canvas_backing_height`);
      const scaleX = surface?.canvas?.backing_scale?.x;
      const scaleY = surface?.canvas?.backing_scale?.y;
      if (!finiteNumber(scaleX) || !finiteNumber(scaleY) || scaleX <= 0 || scaleY <= 0 || Math.abs(scaleX - scaleY) > .01) {
        failures.push(`${label}.canvas_backing_scale`);
      }
      return failures;
    }

    function validateExactGameLoad(telemetry) {
      const failures = [];
      if (!telemetry || telemetry.schema !== "alveolus.render_stress.v1") {
        failures.push("missing_or_unknown_game_telemetry");
        return { valid: false, failures };
      }
      if (telemetry.rendered !== true) failures.push("game_not_rendered");
      if (telemetry.machine?.web !== true) failures.push("game_not_web_build");
      if (telemetry.acceptance?.valid !== true) failures.push("game_acceptance_invalid");
      for (const [key, expected] of Object.entries(EXPECTED_ENTITIES)) {
        if (telemetry.entities?.[key] !== expected) failures.push(`entities.${key}:${telemetry.entities?.[key]}!=${expected}`);
      }
      for (const [key, expected] of Object.entries(EXPECTED_RENDER)) {
        if (telemetry.render?.[key] !== expected) failures.push(`render.${key}:${telemetry.render?.[key]}!=${expected}`);
      }
      return { valid: failures.length === 0, failures };
    }

    function validateHardRequirements(report, run) {
      const failures = [];
      const requireFinite = (path, value, minimum = 0) => {
        if (!finiteNumber(value) || value < minimum) failures.push(`${path}_not_finite_or_below_${minimum}`);
      };
      requireFinite("configured_duration_ms", report.configured_duration_ms, 5000);
      requireFinite("configured_warmup_ms", report.warmup_ms, 0);
      requireFinite("measured_ms", report.measured_ms, report.configured_duration_ms);
      requireFinite("frames", report.frames, 1);
      for (const [key, value] of Object.entries(report.timing_ms)) requireFinite(`timing_ms.${key}`, value, 0);
      for (const [key, value] of Object.entries(report.fps)) requireFinite(`fps.${key}`, value, 0);
      if (report.measurement_completed !== true) failures.push(`measurement_incomplete:${report.measurement_abort_reason}`);
      if (run.hiddenSeen || run.visibilityTimeline.some(entry => entry.hidden)) failures.push("document_was_hidden");
      if (!run.iframeErrorHookAttached) failures.push("iframe_error_capture_unavailable");
      if (report.quality.observed_errors.length > 0) failures.push("javascript_errors_observed");
      failures.push(...validateSurface(report.surface.start, "surface.start"));
      failures.push(...validateSurface(report.surface.end, "surface.end"));
      const game = report.game_telemetry;
      if (!game || game.schema !== "alveolus.render_stress.v1") failures.push("telemetry_schema");
      if (game?.rendered !== true) failures.push("telemetry_rendered");
      if (game?.machine?.web !== true) failures.push("telemetry_web");
      if (game?.acceptance?.valid !== true) failures.push("telemetry_acceptance");
      requireFinite("telemetry.measured_seconds", game?.measured_seconds, durationSeconds - .001);
      requireFinite("telemetry.warmup_seconds", game?.warmup_seconds, 0);
      requireFinite("telemetry.timing_ms.p95", game?.timing_ms?.p95, 0);
      if (finiteNumber(game?.warmup_seconds) && Math.abs(game.warmup_seconds - warmupSeconds) > .001) failures.push("telemetry_warmup_mismatch");
      if (new URL(report.game_url).searchParams.get("alveolus_soak_run_id") !== report.run_id) failures.push("run_id_query_mismatch");
      if (run.readySeen !== true || run.resultSeen !== true) failures.push("telemetry_protocol_incomplete");
      return { valid: failures.length === 0, failures };
    }

    async function inspectBuild(url) {
      const cleanUrl = new URL(url.href);
      cleanUrl.search = "";
      const pckUrl = new URL("index.pck", cleanUrl);
      try {
        const [htmlResponse, pckResponse] = await Promise.all([
          fetch(cleanUrl.href, { cache: "no-store" }),
          fetch(pckUrl.href, { method: "HEAD", cache: "no-store" }),
        ]);
        const htmlBytes = await htmlResponse.arrayBuffer();
        let htmlSha256 = null;
        if (crypto?.subtle) {
          const digest = await crypto.subtle.digest("SHA-256", htmlBytes);
          htmlSha256 = Array.from(new Uint8Array(digest), value => value.toString(16).padStart(2, "0")).join("");
        }
        const pck = {
          url: pckUrl.href,
          ok: pckResponse.ok,
          etag: pckResponse.headers.get("etag"),
          last_modified: pckResponse.headers.get("last-modified"),
          content_length: Number(pckResponse.headers.get("content-length")) || null,
        };
        return {
          id: htmlSha256 ? `html-${htmlSha256.slice(0, 16)}-pck-${pck.content_length ?? "unknown"}` : null,
          html: { url: cleanUrl.href, ok: htmlResponse.ok, sha256: htmlSha256, bytes: htmlBytes.byteLength },
          pck,
        };
      } catch (error) {
        return { id: null, error: errorDetails(error) };
      }
    }

    async function startMeasurement() {
      if (measurementRunning) return;
      measurementRunning = true;
      startButton.disabled = true;
      window.__ALVEOLUS_SOAK__ = { done: false, report: null };
      result.textContent = "Webbuild wird für eine isolierte Messung neu geladen …";
      status.textContent = "Stresslauf wird vorbereitet …";
      const run = beginNavigation("measurement");

      try {
        const readyReceived = await waitForSignal(run.ready, 30000);
        if (run !== activeRun) throw new Error("measurement_run_replaced");
        if (!readyReceived) recordDiagnostic("error", "protocol.ready_timeout", { message: "No ready message within 30 seconds." }, run);

        run.stage = "warmup";
        status.textContent = `Warmup ${Math.round(warmupSeconds)} s`;
        const surfaceStart = captureSurface();
        const warmup = await runAnimationFramePhase(run, warmupMs, false);
        const memoryBefore = performance.memory?.usedJSHeapSize ?? null;

        run.stage = "measurement";
        status.textContent = `Messung ${Math.round(durationSeconds)} s`;
        const measurement = warmup.completed
          ? await runAnimationFramePhase(run, durationMs, true)
          : { completed: false, reason: `warmup_${warmup.reason}`, elapsedMs: 0, samples: new Float64Array(0), count: 0 };
        const memoryAfter = performance.memory?.usedJSHeapSize ?? null;

        run.stage = "telemetry_wait";
        if (!run.resultSeen && readyReceived) await waitForSignal(run.telemetry, 5000);
        const summary = summarizeSamples(measurement);
        const surfaceEnd = captureSurface();
        const runDiagnostics = diagnostics.slice(run.errorStartIndex).filter(entry => entry.run_id === run.id);
        const observedErrors = runDiagnostics.filter(entry => entry.level === "error");
        const build = await run.buildInfoPromise;
        const exactGameLoad = validateExactGameLoad(run.gameTelemetry);
        const browserThresholdsPassed = measurement.completed
          && summary.fps.effective >= 58
          && summary.timing.p95 <= 22.2
          && summary.stalls === 0;
        const report = {
          schema: "alveolus.browser_performance.v1",
          passed: false,
          browser_passed: false,
          run_id: run.id,
          correlation_mode: run.correlationMode,
          build,
          game_exact_load: exactGameLoad,
          game_telemetry_received: run.gameTelemetry != null,
          game_url: run.url.href,
          user_agent: navigator.userAgent,
          viewport: { width: innerWidth, height: innerHeight, device_pixel_ratio: devicePixelRatio },
          surface: { expected_css: EXPECTED_SURFACE, start: surfaceStart, end: surfaceEnd },
          visibility_focus_timeline: run.visibilityTimeline,
          configured_duration_ms: durationMs,
          warmup_ms: warmupMs,
          warmup_completed: warmup.completed,
          warmup_abort_reason: warmup.reason,
          measurement_completed: measurement.completed,
          measurement_abort_reason: measurement.reason,
          measured_ms: measurement.elapsedMs,
          frames: measurement.count,
          timing_ms: summary.timing,
          fps: summary.fps,
          quality: {
            long_frames_over_50ms: summary.longFrames,
            stalls_over_100ms: summary.stalls,
            observed_errors: observedErrors,
            diagnostics: runDiagnostics,
          },
          memory_bytes: {
            before: memoryBefore,
            after: memoryAfter,
            delta: memoryBefore == null || memoryAfter == null ? null : memoryAfter - memoryBefore,
          },
          game_telemetry: run.gameTelemetry,
          limitations: [
            "Measures requestAnimationFrame on the shared browser main thread.",
            ...(run.correlationMode === "same_origin_query" ? [] : ["Cross-origin game: message correlation is limited to source plus a single accepted result."]),
            ...(build?.id ? [] : ["Build fingerprint unavailable."]),
          ],
        };
        report.hard_acceptance = validateHardRequirements(report, run);
        report.browser_passed = browserThresholdsPassed && report.hard_acceptance.valid;
        report.passed = report.browser_passed && exactGameLoad.valid;

        const encoded = JSON.stringify(report);
        console.log("ALVEOLUS_BROWSER_SOAK_JSON=" + encoded);
        result.textContent = JSON.stringify(report, null, 2);
        status.textContent = report.passed ? "Messung bestanden" : "Messung außerhalb der Grenzwerte";
        window.__ALVEOLUS_SOAK__ = { done: true, report };
      } catch (error) {
        const details = errorDetails(error);
        recordDiagnostic("error", "harness.measurement_exception", details, run);
        const fatalReport = {
          schema: "alveolus.browser_performance.v1",
          passed: false,
          run_id: run.id,
          fatal_error: details,
          diagnostics: diagnostics.slice(run.errorStartIndex).filter(entry => entry.run_id === run.id),
        };
        result.textContent = JSON.stringify(fatalReport, null, 2);
        status.textContent = "Messung fehlgeschlagen";
        window.__ALVEOLUS_SOAK__ = { done: true, report: fatalReport };
      } finally {
        run.stage = "complete";
        measurementRunning = false;
        startButton.disabled = false;
      }
    }

    startButton.addEventListener("click", startMeasurement);

    function loadPreview() {
      const run = beginNavigation("preview");
      status.textContent = "Webbuild wird geladen …";
      setTimeout(() => {
        if (activeRun === run && !run.readySeen && !measurementRunning) {
          startButton.disabled = false;
          status.textContent = "Keine Spieltelemetrie empfangen · Messung wird als ungültig markiert.";
        }
      }, 20000);
    }

    if (params.get("autostart") === "1") startMeasurement();
    else loadPreview();
  </script>
</body>
</html>
